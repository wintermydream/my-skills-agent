# API配置（请替换为你自己的密钥）
api_keys:
  zhipu: "your-zhipu-api-key-here"
  qwen: "your-qwen-api-key-here"
  openrouter: "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"

# 模型配置
models:
  mimo-v2-flash:
    provider: openrouter
    model_name: xiaomi/mimo-v2-flash:free
    price_per_1m_tokens: 0
  claude-3.5-haiku:
    provider: openrouter
    model_name: anthropic/claude-3.5-haiku
    price_per_1m_tokens: 1
  glm-4:
    provider: zhipu
    model_name: glm-4
    price_per_1m_tokens: 10
  qwen-max:
    provider: qwen
    model_name: qwen-max
    price_per_1m_tokens: 12

# 默认设置
default_model: mimo-v2-flash
temperature: 0.7
max_tokens: 2000
enable_cache: true